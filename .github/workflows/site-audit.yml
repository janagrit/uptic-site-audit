name: Site audit

on:
  schedule:
    - cron: '0 6 * * *' # daily, 06:00 UTC
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to test (leave empty for the BASE_URL repo variable, else production)'
        required: false
        default: ''
  push:
    branches: [main]
  pull_request:

concurrency:
  group: site-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same image as `npm run test:visual:update:linux`, so visual baselines match. Keep in sync with @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    env:
      BASE_URL: ${{ inputs.base_url || vars.BASE_URL || 'https://uptichospitality.com' }}
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -p .

      # Full suite + regression baseline: fails if a test was removed, skipped or newly marked
      # as a known defect without updating baseline/results.json (skipped for non-production targets).
      - name: Run Playwright tests
        run: npx playwright test
        env:
          BASELINE: check

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload failure traces and screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: test-results/
          retention-days: 14
