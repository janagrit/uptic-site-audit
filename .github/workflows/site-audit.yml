name: Site audit

on:
  schedule:
    - cron: '0 6 * * *' # daily, 06:00 UTC
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to test (leave empty for the BASE_URL repo variable, else production)'
        required: false
        default: ''
      skip_bugs:
        description: 'Skip tests tagged @bug (open site defects) — the run is then green unless something new broke'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
  pull_request:

concurrency:
  group: site-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same image as `npm run test:visual:update:linux`, so visual baselines match. Keep in sync with @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    # The suite lives in e2e/site-audit/; every run step starts there.
    defaults:
      run:
        working-directory: e2e/site-audit
    env:
      BASE_URL: ${{ inputs.base_url || vars.BASE_URL || 'https://uptichospitality.com' }}
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -p .

      # Full suite + regression baseline. Red while any @bug test (open site defect) fails; the
      # step summary separates open bugs from new failures. Also red if a test was removed, skipped,
      # newly tagged @bug or fixed without updating baseline/results.json (production only).
      # A manual run with skip_bugs leaves out @bug tests, and with them the baseline check.
      - name: Run Playwright tests
        run: npx playwright test ${{ inputs.skip_bugs && '--grep-invert @bug' || '' }}
        env:
          BASELINE: ${{ inputs.skip_bugs && 'off' || 'check' }}

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: e2e/site-audit/playwright-report/
          retention-days: 14

      - name: Upload failure traces and screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: e2e/site-audit/test-results/
          retention-days: 14
